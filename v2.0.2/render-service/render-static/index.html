<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <title>Renderer Engine v2.0.2 - Native Overlay</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/fabric.js/5.3.1/fabric.min.js"></script>
    <link rel="stylesheet" href="/assets/css/fonts.css">
    <script src="/assets/js/lib/ffmpeg.js"></script>
    <script>
        window.baseURL = "/";
        const originalSetProperty = CanvasRenderingContext2D.prototype.__lookupSetter__('textBaseline');
        Object.defineProperty(CanvasRenderingContext2D.prototype, 'textBaseline', {
            set: function (value) {
                const correctedValue = (value === 'alphabetical') ? 'alphabetic' : value;
                return originalSetProperty.call(this, correctedValue);
            }
        });
        window.FFmpegWASM = { FFmpeg: class { constructor() { } load() { return Promise.resolve(); } on() { return this; } off() { return this; } exec() { return Promise.resolve(0); } writeFile() { return Promise.resolve(); } readFile() { return Promise.resolve(new Uint8Array()); } terminate() { } } };
    </script>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: #000;
            overflow: hidden;
        }

        .canvas-wrapper {
            position: relative;
            width: 1024px;
            height: 816px;
            margin: 0 auto;
        }

        #bg-video {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            z-index: 0;
            display: block;
            background: #000;
        }

        #c {
            position: absolute;
            top: 0;
            left: 0;
            z-index: 10;
            display: block;
        }
    </style>
</head>

<body>
    <div class="canvas-wrapper" id="render-area">
        <video id="bg-video" muted crossorigin="anonymous" playsinline></video>
        <canvas id="c"></canvas>
    </div>

    <div style="display:none">
        <input id="conf-nombre"><input id="conf-inicio"><input id="conf-fin">
        <input id="conf-zoom"><input id="conf-logo"><input id="conf-audio">
        <input id="conf-creditos">
        <select id="workspace-zoom-select">
            <option value="1">1</option>
        </select>
        <div id="layers-list"></div>
        <div id="timeline-container"></div>
    </div>

    <script type="module">
        import '/assets/js/main.js';

        const videoEl = document.getElementById('bg-video');

        window.loadJsonAndRender = async (data) => {
            if (!window.AppState || !window.AppState.canvas) {
                await new Promise(r => {
                    const i = setInterval(() => {
                        if (window.AppState && window.AppState.canvas) { clearInterval(i); r(); }
                    }, 50);
                });
            }

            const canvas = window.AppState.canvas;

            // Forzar dimensiones y transparencia absoluta
            const width = data.ancho || 1024;
            const height = data.alto || 816;
            document.querySelector('.canvas-wrapper').style.width = width + 'px';
            document.querySelector('.canvas-wrapper').style.height = height + 'px';

            canvas.setWidth(width);
            canvas.setHeight(height);
            canvas.backgroundColor = 'rgba(0,0,0,0)'; // Transparente
            canvas.backgroundImage = null;

            if (document.fonts) await document.fonts.ready;

            if (window.importJson) {
                await window.importJson(data);
                // Re-asegurar transparencia tras el import
                canvas.backgroundColor = 'rgba(0,0,0,0)';
            }

            return new Promise((resolve, reject) => {
                if (data.video) {
                    videoEl.src = data.video;
                    const onReady = () => {
                        videoEl.removeEventListener('canplaythrough', onReady);
                        canvas.renderAll();
                        resolve();
                    };
                    videoEl.addEventListener('canplaythrough', onReady);
                    videoEl.onerror = reject;
                    videoEl.load();
                } else resolve();
            });
        };

        // Diagnóstico de 404 total (Imágenes, scripts, etc.)
        window.addEventListener('error', (e) => {
            const target = e.target || e.srcElement;
            const url = target.src || target.href;
            if (url) console.error(`[404 Diagnostic] No se pudo cargar: ${url}`);
        }, true);

        window.getCalculatedDuration = () => {
            const canvas = window.AppState.canvas;
            let maxTime = 2;
            canvas.getObjects().forEach(obj => {
                if (obj.elementType === 'marquesina' || obj.type === 'marquesina' || obj.isMarquesina) {
                    const speed = obj.customProps?.velocidad || 100;
                    const textWidth = obj.width * obj.scaleX;
                    const scrollTime = (textWidth + canvas.width) / speed;
                    if (scrollTime > maxTime) maxTime = scrollTime;
                }
                if (obj.fin && parseFloat(obj.fin) > maxTime) maxTime = parseFloat(obj.fin);
            });
            return Math.ceil(maxTime);
        };

        window.renderFrame = async function (frameIndex, fps, startTime) {
            const canvas = window.AppState.canvas;
            const currentTime = startTime + (frameIndex / fps);

            if (videoEl.src && videoEl.duration) {
                videoEl.currentTime = currentTime % videoEl.duration;
                await new Promise(r => {
                    const onSeeked = () => {
                        videoEl.removeEventListener('seeked', onSeeked);
                        r();
                    };
                    videoEl.addEventListener('seeked', onSeeked);
                    setTimeout(onSeeked, 500); // Failsafe
                });
            }

            if (canvas) {
                canvas.getObjects().forEach(obj => {
                    if (obj.elementType === 'marquesina' || obj.type === 'marquesina' || obj.isMarquesina) {
                        const speed = obj.customProps?.velocidad || 100;
                        obj.set('left', canvas.width - (speed * currentTime));
                    }
                });
                canvas.renderAll();
            }
        };
    </script>
</body>

</html>
